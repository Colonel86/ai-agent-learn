[project]
name = "nba_sql_tuner"
version = "0.1.0"
description = "本地复现 DeepLearning.AI/Lamini《Improving Accuracy of LLM Applications》:NBA SQL Agent + 评估驱动的准确率提升阶梯 + fine-tuning vs memory tuning 对比"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "peft>=0.11",
    "datasets",
    "accelerate",
    "pandas",
    "jsonlines",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
