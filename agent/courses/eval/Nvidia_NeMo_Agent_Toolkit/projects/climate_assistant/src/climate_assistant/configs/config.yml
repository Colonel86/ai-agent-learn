functions:
  current_datetime:
    _type: current_datetime
  climate_assistant:
    _type: climate_assistant
    prefix: "Hello:"

llms:
  nim_llm:
    _type: nim
    model_name: nvidia/nemotron-3-nano-30b-a3b
    temperature: 0.0

workflow:
  _type: react_agent
  llm_name: nim_llm
  tool_names: [current_datetime, climate_assistant]
